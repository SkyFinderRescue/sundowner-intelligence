name: SI-4 Richardson Wave-Breaking 2024 CV

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/SI4_RICHARDSON_WAVEBREAKING_PREDECLARED.md'
      - 'tools/evaluate-si4-richardson-wavebreaking-2024-cv.js'
      - '.github/workflows/si4-richardson-wavebreaking-2024-cv.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  richardson-wavebreaking-2024-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check tools/evaluate-si4-richardson-wavebreaking-2024-cv.js
      - name: Verify predeclaration predates evaluator
        run: |
          test -s research/SI4_RICHARDSON_WAVEBREAKING_PREDECLARED.md
          git log --format='%H %ct' -- research/SI4_RICHARDSON_WAVEBREAKING_PREDECLARED.md | tail -1 > /tmp/predeclared_commit
          git log --format='%H %ct' -- tools/evaluate-si4-richardson-wavebreaking-2024-cv.js | tail -1 > /tmp/evaluator_commit
          PRE=$(awk '{print $2}' /tmp/predeclared_commit)
          EVA=$(awk '{print $2}' /tmp/evaluator_commit)
          test "$PRE" -le "$EVA"
      - name: Download authoritative frozen all-season artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/si4-frozen
          gh run download 31925677059 --repo SkyFinderRescue/sundowner-intelligence --name si4-all-season-frozen-holdout --dir /tmp/si4-frozen
          test -s /tmp/si4-frozen/hrrr-upper-fixed-lead-all-season.json
      - name: Verify 2025 cannot enter development evaluator
        run: |
          grep -q 'const START="2024-01-01", END="2024-12-31"' tools/evaluate-si4-richardson-wavebreaking-2024-cv.js
          grep -q 'holdout_2025_loaded:false' tools/evaluate-si4-richardson-wavebreaking-2024-cv.js
          grep -q 'development_year:2024' tools/evaluate-si4-richardson-wavebreaking-2024-cv.js
      - name: Run frozen 2024 chronological Richardson diagnostic
        env:
          UPPER_CACHE: /tmp/si4-frozen/hrrr-upper-fixed-lead-all-season.json
          OUT: research/si4-richardson-wavebreaking-2024-cv.json
        run: node tools/evaluate-si4-richardson-wavebreaking-2024-cv.js
      - name: Enforce development-only provenance and frozen gate schema
        run: |
          node - <<'NODE'
          const x=require('./research/si4-richardson-wavebreaking-2024-cv.json');
          if(x.status!=='RESEARCH_ONLY_2024_DEVELOPMENT') process.exit(2);
          if(x.rules.development_year!==2024||x.rules.holdout_2025_loaded!==false||x.rules.future_observations_label_only!==true) process.exit(3);
          if(x.rules.fire_outcome_used!==false||x.rules.missing_values_fabricated!==false||x.rules.production_change_authorized!==false) process.exit(4);
          if(x.diagnostic.interpretation!=='susceptibility_only_not_proof') process.exit(5);
          if(x.promotion_gates.event_pod_gain_absolute!==0.05||x.promotion_gates.event_far_max_degradation_absolute!==0) process.exit(6);
          if(x.promotion_gates.diagnostic_coverage_min!==0.90) process.exit(7);
          console.log({counts:x.counts,gates:x.gates,passes_all_2024:x.passes_all_2024});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-richardson-wavebreaking-2024-cv
          path: research/si4-richardson-wavebreaking-2024-cv.json
          if-no-files-found: warn
          retention-days: 30
