name: SI-4 Coastal Adiabatic Lift-Off Archive Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/extract-si4-coastal-adiabatic-liftoff-herbie.py'
      - 'research/SI4_COASTAL_ADIABATIC_LIFTOFF_2024_PREDECLARED.md'
      - '.github/workflows/si4-coastal-adiabatic-liftoff-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen indexed HRRR dependencies
        run: python -m pip install --quiet 'herbie-data>=2025.7' 'cfgrib>=0.9.15' 'xarray>=2025.1' pandas numpy scikit-learn
      - name: Syntax and leakage guards
        run: |
          set -euo pipefail
          python -m py_compile tools/extract-si4-coastal-adiabatic-liftoff-herbie.py
          grep -q 'coastal_adiabatic_liftoff_v1 extractor is locked to 2024 development' tools/extract-si4-coastal-adiabatic-liftoff-herbie.py
          grep -q 'holdout_2025_loaded": False' tools/extract-si4-coastal-adiabatic-liftoff-herbie.py
          grep -q 'future_observations_label_only": True' tools/extract-si4-coastal-adiabatic-liftoff-herbie.py
          grep -q 'fire_association_outcome_only": True' tools/extract-si4-coastal-adiabatic-liftoff-herbie.py
      - name: Extract one frozen F24 development day with bounded infrastructure retry
        shell: bash
        run: |
          set -u
          ok=0
          for attempt in 1 2 3; do
            echo "coastal lift-off smoke attempt ${attempt}/3"
            if python tools/extract-si4-coastal-adiabatic-liftoff-herbie.py --start 2024-04-01 --end 2024-04-01 --fxx 24 --out /tmp/si4-coastal-liftoff-smoke.json; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt*30)); fi
          done
          test "$ok" -eq 1
      - name: Verify fail-closed archive contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/si4-coastal-liftoff-smoke.json'))
          assert x['status']=='RESEARCH_ONLY_2024_DEVELOPMENT'
          assert x['candidate_family']=='coastal_adiabatic_liftoff_v1'
          assert x['forecast_lead_hours']==24
          assert x['failure_count']==0, x['failures']
          assert x['row_count']==16, x['row_count']
          assert x['rules']['holdout_2025_loaded'] is False
          assert x['rules']['production_change_authorized'] is False
          assert all(len(r['profile'])==4 for r in x['rows'])
          assert all([p['pressureHpa'] for p in r['profile']]==[925,900,875,850] for r in x['rows'])
          print({'rows':x['row_count'],'optional_failures':x['optional_failure_count']})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-coastal-adiabatic-liftoff-smoke
          path: /tmp/si4-coastal-liftoff-smoke.json
          if-no-files-found: warn
          retention-days: 30
