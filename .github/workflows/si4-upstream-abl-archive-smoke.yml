name: SI-4 Upstream ABL Reservoir Archive Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/SI4_UPSTREAM_ABL_RESERVOIR_2024_PREDECLARED.md'
      - 'tools/extract-si4-upstream-abl-herbie.py'
      - '.github/workflows/si4-upstream-abl-archive-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-abl-archive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install indexed HRRR subset reader
        run: python -m pip install --quiet 'herbie-data>=2025.7' 'cfgrib>=0.9.15' 'xarray>=2025.1' pandas numpy scikit-learn
      - name: Syntax check
        run: python -m py_compile tools/extract-si4-upstream-abl-herbie.py
      - name: Verify predeclared development lock
        run: |
          grep -q 'upstream_abl_reservoir_v1' research/SI4_UPSTREAM_ABL_RESERVOIR_2024_PREDECLARED.md
          grep -q '2025 FORBIDDEN DURING DEVELOPMENT' research/SI4_UPSTREAM_ABL_RESERVOIR_2024_PREDECLARED.md
          grep -q 'POD/recall improves by at least \*\*+0.05 absolute\*\*' research/SI4_UPSTREAM_ABL_RESERVOIR_2024_PREDECLARED.md
          grep -q 'holdout_2025_loaded' tools/extract-si4-upstream-abl-herbie.py
          ! grep -q '2025-' tools/extract-si4-upstream-abl-herbie.py
      - name: Extract one availability-only 2024 F24 smoke day
        shell: bash
        run: |
          set -u
          ok=0
          for attempt in 1 2 3; do
            if python tools/extract-si4-upstream-abl-herbie.py --start 2024-04-01 --end 2024-04-01 --fxx 24 --out /tmp/si4-upstream-abl-smoke.json; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt*20)); fi
          done
          test "$ok" -eq 1
      - name: Verify fields, transforms, provenance and no production authorization
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open('/tmp/si4-upstream-abl-smoke.json'))
          assert x['status']=='RESEARCH_ONLY_2024_DEVELOPMENT'
          assert x['candidate_family']=='upstream_abl_reservoir_v1'
          assert x['forecast_lead_hours']==24
          assert x['failure_count']==0, x['failures']
          assert len(x['rows'])==12, len(x['rows'])
          assert set(x['points'])=={'santa_ynez_valley','santa_barbara_lee','western_channel'}
          assert x['rules']['holdout_2025_loaded'] is False
          assert x['rules']['production_change_authorized'] is False
          assert x['rules']['future_observations_label_only'] is True
          for row in x['rows']:
              assert row['valid_time'].startswith('2024-')
              for k in ('temperature2mC','dewpoint2mC','dewpointDepressionC','u10Mps','v10Mps','wind10SpeedMph','wind10DirectionDeg'):
                  assert math.isfinite(float(row[k])), (row['point'],k,row[k])
              # PBLH is predeclared as optional when native availability permits;
              # if present it must be finite and nonnegative, otherwise it stays null.
              if row['pblHeightM'] is not None:
                  assert math.isfinite(float(row['pblHeightM'])) and row['pblHeightM'] >= 0
          print({'rows':len(x['rows']),'points':len(x['points']),'status':'archive-smoke-pass'})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-upstream-abl-archive-smoke
          path: /tmp/si4-upstream-abl-smoke.json
          if-no-files-found: warn
          retention-days: 30
