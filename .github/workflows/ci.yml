name: Sundowner Intelligence QA

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check model.js
          node --check ui.js
      - name: Model and architecture tests
        run: node tests/model.test.js
      - name: Mocked end-to-end application test
        run: node tests/e2e.mock.test.js
      - name: Live upstream integration test
        run: node tests/live.integration.test.js
      - name: Diagnose production Pages endpoint
        run: |
          echo "PAGES_HTTP=$(curl -sS -o /tmp/page.html -w '%{http_code}' https://skyfinderrescue.github.io/sundowner-intelligence/)"
          head -c 200 /tmp/page.html || true
          echo
          echo "PAGES_API_HTTP=$(curl -sS -o /tmp/pages.json -w '%{http_code}' https://api.github.com/repos/SkyFinderRescue/sundowner-intelligence/pages)"
          cat /tmp/pages.json
          echo
          curl -sS 'https://api.github.com/repos/SkyFinderRescue/sundowner-intelligence/actions/runs?event=push&branch=main&per_page=10' > /tmp/runs.json
          node -e "const j=require('/tmp/runs.json'); console.log((j.workflow_runs||[]).map(x=>({name:x.name,status:x.status,conclusion:x.conclusion,id:x.id,head_sha:x.head_sha})))"
