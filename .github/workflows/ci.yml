name: Sundowner Intelligence QA

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check model.js
          node --check ui.js
      - name: Model and architecture tests
        run: node tests/model.test.js
      - name: Mocked end-to-end application test
        run: node tests/e2e.mock.test.js
      - name: Live upstream integration test
        run: node tests/live.integration.test.js
      - name: Production Pages endpoint probe
        run: curl -fsSL --retry 2 https://skyfinderrescue.github.io/sundowner-intelligence/ | grep -q "Sundowner Intelligence"
