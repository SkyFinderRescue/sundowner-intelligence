name: Sundowner Intelligence QA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'research/**'
      - 'tools/build-si4-calibration.js'
      - 'tools/probe-si4-archives.js'
      - 'tools/probe-swex-catalog.js'
      - 'tools/extract-hrrr-upper-herbie.py'
      - 'tools/score-si4-nws-benchmark.js'
      - '.github/workflows/si4-research.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check model.js
          node --check ui.js
          node --check tools/validate-fixed-lead.js
          node --check tools/build-calibration.js
      - name: Static artifact checks
        run: |
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('calibration.json')); const e=JSON.parse(fs.readFileSync('data/known-sundowner-events.json')); if(!Array.isArray(e.events)||e.events.length<20) process.exit(1);"
      - name: Model and architecture tests
        run: node tests/model.test.js
      - name: Mocked end-to-end application test
        run: node tests/e2e.mock.test.js
      - name: Live upstream integration test
        run: node tests/live.integration.test.js
