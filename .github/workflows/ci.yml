name: Sundowner Intelligence QA

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check model.js
          node --check ui.js
      - name: Model and architecture tests
        run: node tests/model.test.js
      - name: Mocked end-to-end application test
        run: node tests/e2e.mock.test.js
      - name: Live upstream integration test
        run: node tests/live.integration.test.js
      - name: Probe shareable static endpoints
        run: |
          for url in \
            'https://raw.githack.com/SkyFinderRescue/sundowner-intelligence/main/index.html' \
            'https://cdn.jsdelivr.net/gh/SkyFinderRescue/sundowner-intelligence@main/index.html'; do
            echo "URL=$url"
            curl -fsSL --retry 2 "$url" -o /tmp/host.html
            grep -q 'Sundowner Intelligence' /tmp/host.html
            echo "INDEX_PASS"
          done
          curl -fsSL --retry 2 'https://raw.githack.com/SkyFinderRescue/sundowner-intelligence/main/core.js' | grep -q 'discoverCountyStations' && echo 'GITHACK_CORE_PASS'
          curl -fsSL --retry 2 'https://raw.githack.com/SkyFinderRescue/sundowner-intelligence/main/model.js' | grep -q 'gfs_hrrr' && echo 'GITHACK_MODEL_PASS'
      - name: Inspect historical RAWS archive format
        run: |
          curl -fsSL --retry 2 'https://mesonet.agron.iastate.edu/cgi-bin/request/hads.py?station=RHWC1&network=CA_DCP&year1=2025&month1=7&day1=1&hour1=0&minute1=0&year2=2025&month2=7&day2=2&hour2=0&minute2=0&what=txt&delim=comma' -o /tmp/hads.txt
          echo 'HADS_SAMPLE_BEGIN'
          head -n 80 /tmp/hads.txt
          echo 'HADS_SAMPLE_END'
