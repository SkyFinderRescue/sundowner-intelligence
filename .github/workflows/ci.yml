name: Sundowner Intelligence QA

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check model.js
          node --check ui.js
      - name: Model and architecture tests
        run: node tests/model.test.js
      - name: Mocked end-to-end application test
        run: node tests/e2e.mock.test.js
      - name: Live upstream integration test
        run: node tests/live.integration.test.js
      - name: Public browser smoke test
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          URL='https://html-preview.github.io/?url=https://github.com/SkyFinderRescue/sundowner-intelligence/blob/main/index.html'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=90000 --dump-dom "$URL" > /tmp/dom.html 2>/tmp/chrome.err
          grep -q 'Live forecast complete' /tmp/dom.html
          grep -q 'Santa Barbara County observation network' /tmp/dom.html
          grep -q 'SI 2.1' /tmp/dom.html
          if grep -q 'Load error:' /tmp/dom.html; then exit 1; fi
          echo 'SI_2_1_PUBLIC_BROWSER_PASS'
