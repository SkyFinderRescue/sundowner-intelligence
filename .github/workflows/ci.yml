name: Sundowner Intelligence QA

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check model.js
          node --check ui.js
          node --check tools/validate-fixed-lead.js
      - name: Model and architecture tests
        run: node tests/model.test.js
      - name: Mocked end-to-end application test
        run: node tests/e2e.mock.test.js
      - name: Live upstream integration test
        run: node tests/live.integration.test.js
      - name: Independent fixed-lead validation — spring 2025
        env:
          VALIDATION_START: '2025-03-01'
          VALIDATION_END: '2025-05-31'
          VALIDATION_LEADS: '1,2'
        run: node tools/validate-fixed-lead.js
  deployprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Browser-check HTML preview hosts
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          ok=0
          for url in \
            'https://html-preview.github.io/?url=https://github.com/SkyFinderRescue/sundowner-intelligence/blob/main/index.html' \
            'https://htmlpreview.github.io/?https://github.com/SkyFinderRescue/sundowner-intelligence/blob/main/index.html'; do
            echo "CHECK=$url"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=60000 --dump-dom "$url" > /tmp/page.html 2>/tmp/chrome.err || true
            if grep -q 'Live forecast complete' /tmp/page.html && grep -q 'Santa Barbara County observation network' /tmp/page.html; then
              echo "PREVIEW_PASS=$url"
              ok=1
              break
            fi
            grep -n 'id="status"' /tmp/page.html | head -1 || true
            tail -8 /tmp/chrome.err || true
          done
          test "$ok" -eq 1
