name: Sundowner Intelligence QA

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check model.js
          node --check ui.js
      - name: Model and architecture tests
        run: node tests/model.test.js
      - name: Mocked end-to-end application test
        run: node tests/e2e.mock.test.js
      - name: Live upstream integration test
        run: node tests/live.integration.test.js
      - name: Exact-build live browser smoke test
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=90000 --dump-dom 'http://127.0.0.1:8765/index.html' > /tmp/dom.html 2>/tmp/chrome.err
          grep -q 'Live forecast complete' /tmp/dom.html
          grep -q 'Santa Barbara County observation network' /tmp/dom.html
          grep -q 'SI 2.1' /tmp/dom.html
          if grep -q 'Load error:' /tmp/dom.html; then exit 1; fi
          echo 'SI_2_1_EXACT_BUILD_BROWSER_PASS'
      - name: Immutable public browser smoke test
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          URL='https://raw.githack.com/SkyFinderRescue/sundowner-intelligence/d92b3eeaa23eec809de62b0bea3a87dbc3d6ad56/index.html'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=90000 --dump-dom "$URL" > /tmp/public-dom.html 2>/tmp/public-chrome.err
          grep -q 'Live forecast complete' /tmp/public-dom.html
          grep -q 'Santa Barbara County observation network' /tmp/public-dom.html
          grep -q 'SI 2.1' /tmp/public-dom.html
          if grep -q 'Load error:' /tmp/public-dom.html; then exit 1; fi
          echo 'SI_2_1_PUBLIC_BROWSER_PASS'
