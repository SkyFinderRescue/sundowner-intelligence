name: Sundowner Intelligence QA

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check model.js
          node --check ui.js
      - name: Model and architecture tests
        run: node tests/model.test.js
      - name: Mocked end-to-end application test
        run: node tests/e2e.mock.test.js
      - name: Live upstream integration test
        run: node tests/live.integration.test.js
      - name: Probe shareable static endpoints
        run: |
          for url in \
            'https://raw.githack.com/SkyFinderRescue/sundowner-intelligence/main/index.html' \
            'https://cdn.jsdelivr.net/gh/SkyFinderRescue/sundowner-intelligence@main/index.html'; do
            echo "URL=$url"
            curl -fsSLI --retry 2 "$url" | grep -iE 'HTTP/|content-type' | tail -3
            curl -fsSL --retry 2 "$url" -o /tmp/host.html
            grep -q 'Sundowner Intelligence' /tmp/host.html
            echo "INDEX_PASS"
          done
          curl -fsSL --retry 2 'https://raw.githack.com/SkyFinderRescue/sundowner-intelligence/main/core.js' | grep -q 'discoverCountyStations' && echo 'GITHACK_CORE_PASS'
          curl -fsSL --retry 2 'https://raw.githack.com/SkyFinderRescue/sundowner-intelligence/main/model.js' | grep -q 'gfs_hrrr' && echo 'GITHACK_MODEL_PASS'
      - name: Diagnose real hosted browsers
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          for host in \
            'https://raw.githack.com/SkyFinderRescue/sundowner-intelligence/main/index.html' \
            'https://cdn.jsdelivr.net/gh/SkyFinderRescue/sundowner-intelligence@main/index.html'; do
            safe=$(echo "$host" | tr '/:@?&=' '_')
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=90000 --dump-dom "$host" > "/tmp/${safe}.html" 2>"/tmp/${safe}.err" || true
            echo "BROWSER_URL=$host"
            echo 'DOM_HEAD'
            head -n 6 "/tmp/${safe}.html" || true
            echo 'STATUS'
            grep -n 'id="status"' "/tmp/${safe}.html" | head -2 || true
            echo 'CARDS'
            grep -o 'class="card ' "/tmp/${safe}.html" | wc -l || true
            echo 'ERRORS'
            grep -E 'Load error|ERR_|blocked|CORS|Refused|Failed' "/tmp/${safe}.html" "/tmp/${safe}.err" | tail -20 || true
          done
      - name: Historical RAWS archive smoke test
        run: |
          curl -fsSL --retry 2 'https://mesonet.agron.iastate.edu/cgi-bin/request/hads.py?stations=RHWC1&network=CA_DCP&sts=2025-07-01T00:00Z&ets=2025-07-02T00:00Z&what=txt&delim=comma' -o /tmp/hads.txt
          grep -q 'USIRGZZ' /tmp/hads.txt
          grep -q 'UDIRGZZ' /tmp/hads.txt
          echo 'HISTORICAL_RAWS_PASS'
