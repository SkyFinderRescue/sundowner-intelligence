name: SI-4 NDFD 2024 Range Development Sample

on:
  push:
    branches: ["si4-ndfd-benchmark"]
    paths:
      - 'tools/run-ndfd-pilot-range.py'
      - 'tools/run-ndfd-development-range.py'
      - 'tools/filter-ndfd-exact-f24.py'
      - 'tools/score-ndfd-development-2024.py'
      - '.github/workflows/si4-ndfd-development-2024.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: si4-ndfd-development-2024
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT: research/ndfd-development-range-2024.json
      SCORE_OUT: research/ndfd-development-strong-wind-2024.json
      # Systematic, predeclared 2024-only development grid: 01Z on days 1, 8, 15,
      # and 22 of every month. Exact F24 guidance that is absent stays missing;
      # no post-result date substitution is allowed. 2025 remains untouched.
      TARGETS: 2024-01-01T01:00:00+00:00,2024-01-08T01:00:00+00:00,2024-01-15T01:00:00+00:00,2024-01-22T01:00:00+00:00,2024-02-01T01:00:00+00:00,2024-02-08T01:00:00+00:00,2024-02-15T01:00:00+00:00,2024-02-22T01:00:00+00:00,2024-03-01T01:00:00+00:00,2024-03-08T01:00:00+00:00,2024-03-15T01:00:00+00:00,2024-03-22T01:00:00+00:00,2024-04-01T01:00:00+00:00,2024-04-08T01:00:00+00:00,2024-04-15T01:00:00+00:00,2024-04-22T01:00:00+00:00,2024-05-01T01:00:00+00:00,2024-05-08T01:00:00+00:00,2024-05-15T01:00:00+00:00,2024-05-22T01:00:00+00:00,2024-06-01T01:00:00+00:00,2024-06-08T01:00:00+00:00,2024-06-15T01:00:00+00:00,2024-06-22T01:00:00+00:00,2024-07-01T01:00:00+00:00,2024-07-08T01:00:00+00:00,2024-07-15T01:00:00+00:00,2024-07-22T01:00:00+00:00,2024-08-01T01:00:00+00:00,2024-08-08T01:00:00+00:00,2024-08-15T01:00:00+00:00,2024-08-22T01:00:00+00:00,2024-09-01T01:00:00+00:00,2024-09-08T01:00:00+00:00,2024-09-15T01:00:00+00:00,2024-09-22T01:00:00+00:00,2024-10-01T01:00:00+00:00,2024-10-08T01:00:00+00:00,2024-10-15T01:00:00+00:00,2024-10-22T01:00:00+00:00,2024-11-01T01:00:00+00:00,2024-11-08T01:00:00+00:00,2024-11-15T01:00:00+00:00,2024-11-22T01:00:00+00:00,2024-12-01T01:00:00+00:00,2024-12-08T01:00:00+00:00,2024-12-15T01:00:00+00:00,2024-12-22T01:00:00+00:00
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GRIB2 decoder
        run: |
          python -m pip install --quiet 'eccodes==2.44.0'
          python -m eccodes selfcheck
      - name: Run predeclared 2024-only range sample
        run: python tools/run-ndfd-development-range.py
      - name: Preserve only exact F24 guidance
        run: python tools/filter-ndfd-exact-f24.py
      - name: Verify development-sample guards and provenance
        run: |
          python - <<'PY'
          import json
          x=json.load(open('research/ndfd-development-range-2024.json'))
          assert x['status']=='RESEARCH_ONLY_PIPELINE_PILOT_NOT_SKILL_EVIDENCE'
          assert x['rules']['2025_holdout_untouched'] is True
          assert x['rules']['future_observation_leakage'] is False
          assert x['rules']['range_request_full_file_fallback_forbidden'] is True
          assert x['rules']['predeclared_missing_targets_preserved'] is True
          assert x['rules']['exact_step_24_required'] is True
          assert x['rules']['non_exact_step_preserved_as_missing'] is True
          assert len(x['targets']) == 48, len(x['targets'])
          assert len(x['cases']) + len(x['missing_targets']) == 48
          assert len(x['rows']) == 5 * len(x['cases']), (len(x['rows']),len(x['cases']))
          assert all(r['target_valid_utc'].startswith('2024-') for r in x['rows'])
          assert all(c['target_valid_utc'].startswith('2024-') for c in x['cases'])
          assert all(c['effective_lead_hours'] >= 24 for c in x['cases'])
          for c in x['cases']:
              for p in ('wdir','wspd','wgust'):
                  s=c['sources'][p]
                  assert s['source_key']
                  assert len(s['sha256_grib_message']) == 64
                  assert s['valid_time_utc'] == c['target_valid_utc']
                  assert str(s['step']) == '24'
          assert x['transfer']['fraction_of_full_superfiles'] < 0.15, x['transfer']
          print(json.dumps({
              'exact_f24_cases':len(x['cases']),
              'rows':len(x['rows']),
              'rows_with_hads':x['pilot_diagnostics']['rows_with_hads'],
              'missing_target_count':len(x['missing_targets']),
              'transfer':x['transfer'],
              'minimum_effective_lead_hours':x['pilot_diagnostics']['minimum_effective_lead_hours'],
          },indent=2))
          PY
      - name: Score 2024-only deterministic strong-wind threshold support
        run: python tools/score-ndfd-development-2024.py
      - name: Verify 2025 remains untouched and Sundowner threshold remains unfrozen
        run: |
          python - <<'PY'
          import json
          x=json.load(open('research/ndfd-development-strong-wind-2024.json'))
          assert x['status']=='RESEARCH_ONLY_2024_DEVELOPMENT_NOT_2025_SKILL'
          assert x['rules']['2024_only'] is True
          assert x['rules']['2025_holdout_untouched'] is True
          assert x['rules']['future_observation_leakage'] is False
          assert x['rules']['not_a_sundowner_event_score'] is True
          assert x['freeze_decision']['note'].startswith('Sundowner event-rule thresholds remain unfrozen')
          print(json.dumps(x['freeze_decision'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-ndfd-development-range-2024
          path: |
            research/ndfd-development-range-2024.json
            research/ndfd-development-strong-wind-2024.json
          if-no-files-found: warn
          retention-days: 30
