name: SI-4 NBM 2024 Field Inventory

on:
  push:
    branches: [si4-nbm-probabilistic]
    paths:
      - 'tools/inventory-si4-nbm-2024-fields.js'
      - '.github/workflows/si4-nbm-2024-field-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: si4-nbm-2024-field-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  field-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check tools/inventory-si4-nbm-2024-fields.js
      - name: Inventory official NBM F024 wind/gust fields from 2024 indexes only
        env:
          OUT: research/si4-nbm-2024-field-inventory.json
        run: node tools/inventory-si4-nbm-2024-fields.js
      - name: Verify no-science inventory artifact
        run: |
          node - <<'NODE'
          const x=require('./research/si4-nbm-2024-field-inventory.json');
          if(x.status!=='RESEARCH_ONLY_2024_NBM_FIELD_INVENTORY') process.exit(2);
          if(x.rules.development_year!==2024||x.rules.holdout_2025_loaded!==false) process.exit(3);
          if(x.rules.observations_loaded!==false||x.rules.outcomes_loaded!==false) process.exit(4);
          if(x.rules.forecast_hour!==24||x.rules.production_change_authorized!==false) process.exit(5);
          if(!x.normalized_unique_wind_lines.length) process.exit(6);
          console.log({rows:x.rows.length,unique_wind_lines:x.normalized_unique_wind_lines.length});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-nbm-2024-field-inventory
          path: research/si4-nbm-2024-field-inventory.json
          if-no-files-found: warn
          retention-days: 30
