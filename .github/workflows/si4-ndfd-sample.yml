name: SI-4 NDFD GRIB Sample Decode

on:
  push:
    branches: ["si4-ndfd-benchmark"]
    paths:
      - 'tools/inspect-ndfd-grib-sample.py'
      - '.github/workflows/si4-ndfd-sample.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: si4-ndfd-sample
  cancel-in-progress: true

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GRIB2 decoder
        run: |
          python -m pip install --quiet 'eccodes==2.44.0'
          python -m eccodes selfcheck
      - name: Decode official operational CONUS NDFD wind samples
        run: python tools/inspect-ndfd-grib-sample.py
      - name: Verify real Santa Barbara coverage, F24 and research guards
        run: |
          python - <<'PY'
          import json
          x=json.load(open('research/ndfd-grib-sample.json'))
          assert x['status']=='RESEARCH_ONLY_DO_NOT_LOAD_IN_PRODUCTION'
          assert x['rules']['future_observation_leakage'] is False
          assert x['rules']['wrong_geographic_sector_rejected'] is True
          expected={'wdir':'YBUZ98','wgust':'YWUZ98','wspd':'YCUZ98'}
          for p,wmo in expected.items():
              s=x['samples'][p]
              assert s['wmo_super']==wmo, (p,s['wmo_super'])
              assert s['message_count'] >= 24, (p,s['message_count'])
              assert len(s['sha256']) == 64
              assert s['max_nearest_station_distance_km'] is not None and s['max_nearest_station_distance_km'] < 20, (p,s['max_nearest_station_distance_km'])
              assert len(s['step24_messages']) >= 1, f'{p}: no fixed-24h grid in source object'
              for m in s['step24_messages']:
                  sv=m.get('station_values') or {}
                  assert len(sv)==5
                  assert all(v.get('value') is not None for v in sv.values()), (p,sv)
                  assert all(v.get('distance_km',999) < 20 for v in sv.values()), (p,sv)
          print('Operational CONUS NDFD wind files cover Santa Barbara and contain usable F24 grids')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-ndfd-grib-sample
          path: research/ndfd-grib-sample.json
          if-no-files-found: warn
          retention-days: 30
