name: SI-4 NDFD GRIB Sample Decode

on:
  push:
    branches: ["si4-ndfd-benchmark"]
    paths:
      - 'tools/inspect-ndfd-grib-sample.py'
      - '.github/workflows/si4-ndfd-sample.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: si4-ndfd-sample
  cancel-in-progress: true

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GRIB2 decoder
        run: |
          python -m pip install --quiet 'eccodes==2.44.0'
          python -m eccodes selfcheck
      - name: Decode no-hindsight operational CONUS NDFD sample
        run: python tools/inspect-ndfd-grib-sample.py
      - name: Verify fixed cutoff, exact valid time, Santa Barbara coverage and research guards
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          x=json.load(open('research/ndfd-grib-sample.json'))
          assert x['status']=='RESEARCH_ONLY_DO_NOT_LOAD_IN_PRODUCTION'
          r=x['rules']
          assert r['future_observation_leakage'] is False
          assert r['hindsight_selection'] is False
          assert r['wrong_geographic_sector_rejected'] is True
          assert r['latest_archive_revision_after_cutoff_forbidden'] is True
          assert r['target_valid_time_must_match_exactly'] is True
          assert r['common_snapshot_across_wdir_wspd_wgust'] is True
          target=datetime.fromisoformat(x['target_valid_utc'].replace('Z','+00:00'))
          cutoff=datetime.fromisoformat(x['fixed_lead_cutoff_utc'].replace('Z','+00:00'))
          available=datetime.fromisoformat(x['selected_snapshot_available_utc'].replace('Z','+00:00'))
          assert available <= cutoff
          assert (target-available).total_seconds()/3600 >= 24
          assert x['max_nearest_station_distance_km'] < 20, x['max_nearest_station_distance_km']
          expected={'wdir':'YBUZ98','wgust':'YWUZ98','wspd':'YCUZ98'}
          suffix=x['selected_snapshot_suffix']
          for p,wmo in expected.items():
              s=x['samples'][p]
              assert s['wmo_super']==wmo, (p,s['wmo_super'])
              assert len(s['sha256']) == 64
              assert s['source_key'].endswith('_KWBN_'+suffix), (p,s['source_key'],suffix)
              m=s['target_message']
              assert m['valid_time_utc']==x['target_valid_utc'], (p,m['valid_time_utc'])
              sv=m.get('station_values') or {}
              assert len(sv)==5
              assert all(v.get('value') is not None for v in sv.values()), (p,sv)
              assert all(v.get('distance_km',999) < 20 for v in sv.values()), (p,sv)
          print('Operational CONUS NDFD sample passes no-hindsight fixed-cutoff Santa Barbara verification')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-ndfd-grib-sample
          path: research/ndfd-grib-sample.json
          if-no-files-found: warn
          retention-days: 30
