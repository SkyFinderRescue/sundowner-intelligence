name: SI-4 Coastal Adiabatic Lift-Off 2024 Chronological CV

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/evaluate-si4-coastal-adiabatic-liftoff-2024-cv.js'
      - 'research/SI4_COASTAL_ADIABATIC_LIFTOFF_2024_PREDECLARED.md'
      - '.github/workflows/si4-coastal-adiabatic-liftoff-2024-cv.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  coastal-liftoff-2024-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and leakage guards
        run: |
          node --check tools/evaluate-si4-coastal-adiabatic-liftoff-2024-cv.js
          grep -q 'const START="2024-01-01", END="2024-12-31"' tools/evaluate-si4-coastal-adiabatic-liftoff-2024-cv.js
          grep -q 'holdout_2025_loaded:false' tools/evaluate-si4-coastal-adiabatic-liftoff-2024-cv.js
          ! grep -q '2025-' tools/evaluate-si4-coastal-adiabatic-liftoff-2024-cv.js
      - name: Download authoritative frozen baseline upper-air artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/si4-frozen
          gh run download 31925677059 --repo SkyFinderRescue/sundowner-intelligence --name si4-all-season-frozen-holdout --dir /tmp/si4-frozen
          test -s /tmp/si4-frozen/hrrr-upper-fixed-lead-all-season.json
      - name: Download immutable coastal lift-off 2024 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/si4-liftoff
          gh run download 33016117269 --repo SkyFinderRescue/sundowner-intelligence --name si4-coastal-liftoff-2024-full --dir /tmp/si4-liftoff
          test -s /tmp/si4-liftoff/si4-coastal-liftoff-2024-full.json
          test -s /tmp/si4-liftoff/si4-coastal-liftoff-2024-manifest.json
          echo '652c66429dd5942c4e498d628cae48a60c1c5da38aa0bf7585f5d0f49b638fd9  /tmp/si4-liftoff/si4-coastal-liftoff-2024-full.json' | sha256sum -c -
          node - <<'NODE'
          const x=require('/tmp/si4-liftoff/si4-coastal-liftoff-2024-full.json');
          if(x.status!=='RESEARCH_ONLY_2024_DEVELOPMENT_COMBINED'||x.candidate_family!=='coastal_adiabatic_liftoff_v1'||x.row_count!==5840) process.exit(2);
          if(x.rules.holdout_2025_loaded!==false||x.rules.production_change_authorized!==false||x.rules.development_year_only!==2024) process.exit(3);
          console.log({rows:x.row_count,source_artifacts:x.source_artifacts.length});
          NODE
      - name: Run frozen 2024 chronological CV
        env:
          UPPER_CACHE: /tmp/si4-frozen/hrrr-upper-fixed-lead-all-season.json
          LIFTOFF_CACHE: /tmp/si4-liftoff/si4-coastal-liftoff-2024-full.json
          OUT: research/si4-coastal-adiabatic-liftoff-2024-cv.json
        run: node tools/evaluate-si4-coastal-adiabatic-liftoff-2024-cv.js
      - name: Verify fail-closed scientific decision
        run: |
          node - <<'NODE'
          const x=require('./research/si4-coastal-adiabatic-liftoff-2024-cv.json');
          if(x.status!=='RESEARCH_ONLY_2024_DEVELOPMENT'||x.rules.holdout_2025_loaded!==false||x.rules.production_change_authorized!==false) process.exit(2);
          if(x.candidate_family!=='coastal_adiabatic_liftoff_v1'||x.rules.exact_f24!==true) process.exit(3);
          if(typeof x.passes_all!=='boolean'||!x.gates) process.exit(4);
          console.log({rows:x.counts.rows,events:x.counts.events,passes_all:x.passes_all,eligible:x.winner_eligible_for_single_frozen_2025_score});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-coastal-adiabatic-liftoff-2024-cv
          path: research/si4-coastal-adiabatic-liftoff-2024-cv.json
          if-no-files-found: warn
          retention-days: 30
