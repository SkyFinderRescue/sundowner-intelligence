name: SI-4 HREF Initial-Condition Ensemble 2024 CV Source-QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/evaluate-si4-href-initial-condition-ensemble-2024-cv.js'
      - 'tools/run-si4-href-initial-condition-ensemble-2024-cv-source-qc.js'
      - 'research/SI4_INITIAL_CONDITION_ENSEMBLE_DOWNSLOPE_2024_PREDECLARED.md'
      - 'research/SI4_HREF_2024_SOURCE_QC_INCIDENT.md'
      - '.github/workflows/si4-href-initial-condition-ensemble-2024-cv-source-qc.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: si4-href-initial-condition-ensemble-2024-cv-source-qc
  cancel-in-progress: true

jobs:
  href-ensemble-2024-cv-source-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify plumbing-only compatibility runner and 2025 firewall
        run: |
          set -euo pipefail
          node --check tools/run-si4-href-initial-condition-ensemble-2024-cv-source-qc.js
          grep -q '35750' tools/run-si4-href-initial-condition-ensemble-2024-cv-source-qc.js
          grep -q '33432036786' tools/run-si4-href-initial-condition-ensemble-2024-cv-source-qc.js
          grep -q 'observations_or_outcomes_used !== false' tools/run-si4-href-initial-condition-ensemble-2024-cv-source-qc.js
          ! grep -q '2025-' tools/run-si4-href-initial-condition-ensemble-2024-cv-source-qc.js
      - name: Download authoritative frozen baseline upper-air artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/si4-frozen
          gh run download 31925677059 --repo SkyFinderRescue/sundowner-intelligence --name si4-all-season-frozen-holdout --dir /tmp/si4-frozen
          test -s /tmp/si4-frozen/hrrr-upper-fixed-lead-all-season.json
      - name: Download outcome-blind HREF source-QC repaired archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/si4-href-qc
          gh run download 33432036786 --repo SkyFinderRescue/sundowner-intelligence --name si4-href-ensemble-2024-source-qc --dir /tmp/si4-href-qc
          test -s /tmp/si4-href-qc/si4-href-ensemble-2024-source-qc.json
          node - <<'NODE'
          const x=require('/tmp/si4-href-qc/si4-href-ensemble-2024-source-qc.json');
          if(x.status!=='RESEARCH_ONLY_2024_DEVELOPMENT'||x.candidate_family!=='initial_condition_ensemble_downslope_v1') process.exit(2);
          if(x.phase!=='full_2024_href_member_archive_source_qc_repaired'||x.row_count!==35750||(x.rows||[]).length!==35750) process.exit(3);
          if(String(x.provenance?.github_run_id)!=='33415242408'||String(x.provenance?.source_qc_run_id)!=='33432036786') process.exit(4);
          if(x.source_qc?.invalid_row_count!==10||x.source_qc?.matched_rows_removed!==100) process.exit(5);
          if(x.science_scoring_performed!==false||x.observations_or_outcomes_used!==false||x.holdout_2025_loaded!==false||x.production_change_authorized!==false) process.exit(6);
          if((x.rows||[]).some(r=>!String(r.valid_time).startsWith('2024-')||r.issuance_to_valid_lead_h!==24)) process.exit(7);
          if((x.rows||[]).some(r=>!Number.isFinite(Number(r.gust_surface_mps))||Number(r.gust_surface_mps)<0||Number(r.gust_surface_mps)>200)) process.exit(8);
          console.log({rows:x.row_count,source_run:x.provenance.github_run_id,source_qc_run:x.provenance.source_qc_run_id,removed:x.source_qc.matched_rows_removed});
          NODE
      - name: Run unchanged frozen 2024 science logic on repaired archive
        env:
          UPPER_CACHE: /tmp/si4-frozen/hrrr-upper-fixed-lead-all-season.json
          HREF_CACHE: /tmp/si4-href-qc/si4-href-ensemble-2024-source-qc.json
          OUT: research/si4-href-initial-condition-ensemble-2024-cv-source-qc.json
        run: node tools/run-si4-href-initial-condition-ensemble-2024-cv-source-qc.js
      - name: Verify fail-closed scientific decision
        run: |
          node - <<'NODE'
          const x=require('./research/si4-href-initial-condition-ensemble-2024-cv-source-qc.json');
          if(x.status!=='RESEARCH_ONLY_2024_DEVELOPMENT'||x.candidate_family!=='initial_condition_ensemble_downslope_v1') process.exit(2);
          if(x.rules.development_year!==2024||x.rules.holdout_2025_loaded!==false||x.rules.production_change_authorized!==false) process.exit(3);
          if(String(x.rules.href_archive_run)!=='33415242408'||x.rules.href_archive_rows!==35750) process.exit(4);
          if(typeof x.passes_all!=='boolean'||!x.gates||!x.simple_comparator) process.exit(5);
          if(x.passes_all===false&&x.winner_eligible_for_single_frozen_2025_score!==null) process.exit(6);
          console.log({rows:x.coverage.common_rows,events:x.coverage.events,passes_all:x.passes_all,eligible:x.winner_eligible_for_single_frozen_2025_score,gates:x.gates});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-href-initial-condition-ensemble-2024-cv-source-qc
          path: research/si4-href-initial-condition-ensemble-2024-cv-source-qc.json
          if-no-files-found: warn
          retention-days: 30

# plumbing-only retrigger after source-QC linkage verification
