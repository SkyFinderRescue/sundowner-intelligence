name: SI-4 GOES Marine Night Trends

on:
  push:
    branches: [si4-research]
    paths:
      - 'research/GOES_MARINE_MASKS_V1.json'
      - 'research/GOES_BT_AND_NIGHTTIME_VALIDATION.md'
      - 'tools/extract-goes-marine-features.py'
      - 'tools/extract-goes-marine-night-trends.py'
      - '.github/workflows/si4-goes-marine-night-trends.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  night-trends-2024:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical GOES dependencies
        run: python -m pip install --disable-pip-version-check numpy netCDF4 pyproj
      - name: Syntax and solar-night guard test
        run: |
          python -m py_compile tools/extract-goes-marine-features.py tools/extract-goes-marine-night-trends.py
          python - <<'PY'
          import importlib.util,datetime as dt
          p='tools/extract-goes-marine-night-trends.py';s=importlib.util.spec_from_file_location('t',p);m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          for raw in ('2024-04-01T10:00:00+00:00','2024-07-15T10:00:00+00:00'):
            t=dt.datetime.fromisoformat(raw)
            vals=[m.solar_elevation_deg(t-dt.timedelta(hours=h),34.42,-119.80) for h in (6,3,1,0)]
            assert max(vals)<=-6.0,(raw,vals)
            print(raw,vals)
          PY
      - name: Extract issuance-safe 0/1/3/6h nighttime trends
        run: python tools/extract-goes-marine-night-trends.py
      - name: Verify no daylight/future imagery entered Night Microphysics features
        run: |
          python - <<'PY'
          import json,math
          x=json.load(open('research/goes-marine-night-trends-pilot-2024.json'))
          assert x['status']=='RESEARCH_ONLY_DO_NOT_LOAD_IN_PRODUCTION'
          assert x['rules']['development_year']==2024 and x['rules']['nighttime_only'] is True
          assert x['rules']['future_imagery_used'] is False and x['rules']['verifying_winds_loaded'] is False and x['rules']['fire_outcome_used'] is False
          assert len(x['rows'])==2
          for r in x['rows']:
            for s in r['solar_geometry'].values(): assert s['night_eligible'] is True and s['solar_elevation_deg']<=-6
            for snap in r['snapshots'].values():
              assert snap['rules']['all_scan_end_times_lte_issuance'] is True
              for p in snap['provenance'].values(): assert p['age_minutes_at_issue']>=0 and p['age_minutes_at_issue']<=25
            z=r['trends']['domains']['south_coast_strip']['btd_c13_minus_c07_k']
            for k in ('current','change_1h','change_3h','change_6h'): assert z[k] is not None and math.isfinite(z[k])
          print({'anchors':len(x['rows']),'coast_trends':[r['trends']['domains']['south_coast_strip']['btd_c13_minus_c07_k'] for r in x['rows']]})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-goes-marine-night-trends-2024
          path: research/goes-marine-night-trends-pilot-2024.json
          if-no-files-found: warn
          retention-days: 30
