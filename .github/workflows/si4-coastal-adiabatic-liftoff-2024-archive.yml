# Research-only 2024 coastal adiabatic lift-off archive. Frozen fields/points/hypothesis; no 2025 access.
name: SI-4 Coastal Adiabatic Lift-Off 2024 Archive

on:
  push:
    branches: [si4-research]
    paths:
      - 'tools/extract-si4-coastal-adiabatic-liftoff-herbie.py'
      - 'research/SI4_COASTAL_ADIABATIC_LIFTOFF_2024_PREDECLARED.md'
      - '.github/workflows/si4-coastal-adiabatic-liftoff-2024-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: si4-coastal-adiabatic-liftoff-2024-archive
  cancel-in-progress: true

jobs:
  archive-month:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {month: '01', start: '2024-01-01', end: '2024-01-31', days: 31}
          - {month: '02', start: '2024-02-01', end: '2024-02-29', days: 29}
          - {month: '03', start: '2024-03-01', end: '2024-03-31', days: 31}
          - {month: '04', start: '2024-04-01', end: '2024-04-30', days: 30}
          - {month: '05', start: '2024-05-01', end: '2024-05-31', days: 31}
          - {month: '06', start: '2024-06-01', end: '2024-06-30', days: 30}
          - {month: '07', start: '2024-07-01', end: '2024-07-31', days: 31}
          - {month: '08', start: '2024-08-01', end: '2024-08-31', days: 31}
          - {month: '09', start: '2024-09-01', end: '2024-09-30', days: 30}
          - {month: '10', start: '2024-10-01', end: '2024-10-31', days: 31}
          - {month: '11', start: '2024-11-01', end: '2024-11-30', days: 30}
          # F24 from Dec 31 verifies in 2025 and is outside the frozen development boundary.
          - {month: '12', start: '2024-12-01', end: '2024-12-30', days: 30}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen indexed HRRR dependencies
        run: python -m pip install --quiet 'herbie-data>=2025.7' 'cfgrib>=0.9.15' 'xarray>=2025.1' pandas numpy scikit-learn
      - name: Extract frozen month with bounded infrastructure retry
        shell: bash
        run: |
          set -u
          out="/tmp/si4-coastal-liftoff-2024-${{ matrix.month }}.json"
          ok=0
          for attempt in 1 2 3; do
            echo "coastal lift-off 2024-${{ matrix.month }} attempt ${attempt}/3"
            if python tools/extract-si4-coastal-adiabatic-liftoff-herbie.py \
              --start '${{ matrix.start }}' --end '${{ matrix.end }}' --fxx 24 --out "$out"; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt*30)); fi
          done
          test "$ok" -eq 1
      - name: Verify fail-closed monthly contract
        run: |
          python - <<'PY'
          import json
          f='/tmp/si4-coastal-liftoff-2024-${{ matrix.month }}.json'
          x=json.load(open(f))
          expected=${{ matrix.days }}*4*4
          assert x['status']=='RESEARCH_ONLY_2024_DEVELOPMENT'
          assert x['candidate_family']=='coastal_adiabatic_liftoff_v1'
          assert x['forecast_lead_hours']==24
          assert x['failure_count']==0, x['failures'][:10]
          assert x['row_count']==expected, (x['row_count'],expected)
          assert x['rules']['holdout_2025_loaded'] is False
          assert x['rules']['production_change_authorized'] is False
          assert all(r['valid_time'][:4]=='2024' for r in x['rows'])
          assert all(len(r['profile'])==4 for r in x['rows'])
          print({'month':'${{ matrix.month }}','rows':x['row_count'],'optional_failures':x['optional_failure_count']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: si4-coastal-liftoff-2024-${{ matrix.month }}
          path: /tmp/si4-coastal-liftoff-2024-${{ matrix.month }}.json
          if-no-files-found: error
          retention-days: 30

  combine:
    needs: archive-month
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: si4-coastal-liftoff-2024-*
          path: /tmp/si4-coastal-liftoff-months
      - name: Combine immutable full-year development archive with exact provenance
        run: |
          python - <<'PY'
          import glob,hashlib,json,os
          files=sorted(glob.glob('/tmp/si4-coastal-liftoff-months/**/*.json',recursive=True))
          assert len(files)==12, files
          rows=[]; sources=[]; optional=[]
          for f in files:
            raw=open(f,'rb').read(); x=json.loads(raw)
            assert x['status']=='RESEARCH_ONLY_2024_DEVELOPMENT'
            assert x['candidate_family']=='coastal_adiabatic_liftoff_v1'
            assert x['forecast_lead_hours']==24
            assert x['failure_count']==0
            assert x['rules']['holdout_2025_loaded'] is False
            rows.extend(x['rows'])
            optional.extend(x.get('optional_failures') or [])
            sources.append({'artifact_file':os.path.basename(f),'sha256':hashlib.sha256(raw).hexdigest(),'start':x['start'],'end':x['end'],'rows':x['row_count']})
          assert len(rows)==5840, len(rows)
          keys=[(r['run_time'],r['valid_time'],r['zone']) for r in rows]
          assert len(keys)==len(set(keys)), 'duplicate provenance key'
          assert all(r['run_time'][:4]=='2024' and r['valid_time'][:4]=='2024' for r in rows)
          rows.sort(key=lambda r:(r['valid_time'],r['zone'],r['run_time']))
          payload={
            'status':'RESEARCH_ONLY_2024_DEVELOPMENT_COMBINED',
            'candidate_family':'coastal_adiabatic_liftoff_v1',
            'source':'NOAA HRRR archived pressure/surface GRIB2 subsets via Herbie indexed range requests',
            'forecast_lead_hours':24,
            'row_count':len(rows),
            'source_artifacts':sources,
            'optional_failure_count':len(optional),
            'rules':{
              'holdout_2025_loaded':False,
              'future_observations_label_only':True,
              'fire_association_outcome_only':True,
              'production_change_authorized':False,
              'missing_values_stay_null':True,
              'exact_f24':True,
              'development_year_only':2024
            },
            'rows':rows
          }
          out='/tmp/si4-coastal-liftoff-2024-full.json'
          text=json.dumps(payload,separators=(',',':'),sort_keys=True)+'\n'
          open(out,'w').write(text)
          digest=hashlib.sha256(text.encode()).hexdigest()
          manifest={'artifact':'si4-coastal-liftoff-2024-full.json','sha256':digest,'rows':len(rows),'source_artifacts':sources}
          open('/tmp/si4-coastal-liftoff-2024-manifest.json','w').write(json.dumps(manifest,indent=2)+'\n')
          print(manifest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: si4-coastal-liftoff-2024-full
          path: |
            /tmp/si4-coastal-liftoff-2024-full.json
            /tmp/si4-coastal-liftoff-2024-manifest.json
          if-no-files-found: error
          retention-days: 30
