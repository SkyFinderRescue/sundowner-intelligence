name: SI-4 NDFD Range F24 Extraction

on:
  push:
    branches: ["si4-ndfd-benchmark"]
    paths:
      - 'tools/extract-ndfd-f24-range.py'
      - '.github/workflows/si4-ndfd-range.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: si4-ndfd-range-f24
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GRIB2 decoder
        run: |
          python -m pip install --quiet 'eccodes==2.44.0'
          python -m eccodes selfcheck
      - name: Extract target valid-time WMO bulletins by HTTP range
        run: python tools/extract-ndfd-f24-range.py
      - name: Verify official valid-day/hour headings, target time and Santa Barbara coverage
        run: |
          python - <<'PY'
          import json
          x=json.load(open('research/ndfd-range-f24-sample.json'))
          assert x['status']=='RESEARCH_ONLY_DO_NOT_LOAD_IN_PRODUCTION'
          assert x['rules']['future_observation_leakage'] is False
          assert x['rules']['range_request_full_file_fallback_forbidden'] is True
          assert x['rules']['official_wmo_valid_day_hour_heading_required'] is True
          assert x['max_nearest_station_distance_km'] < 20, x['max_nearest_station_distance_km']
          # Verified from actual YBUZ98 sequence: source/reference date uses B; next date uses C.
          expected={'wdir':'YBUC01','wspd':'YCUC01','wgust':'YWUC01'}
          for p,h in expected.items():
              r=x['results'][p]
              assert r['expected_target_bulletin']==h, (p,r['expected_target_bulletin'])
              assert r['target_bulletin']==h, (p,r['target_bulletin'])
              assert r['decoded']['valid_time_utc']==x['target_valid_utc'], (p,r['decoded'])
              assert str(r['decoded']['step'])=='24', (p,r['decoded'])
              assert len(r['sha256_grib_message'])==64
              assert len(r['station_values'])==5
              assert all(v['value'] is not None and v['distance_km']<20 for v in r['station_values'].values())
          assert x['transfer']['fraction_of_full_superfiles'] < 0.35, x['transfer']
          print('Range-based exact F24 extraction passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-ndfd-range-f24
          path: research/ndfd-range-f24-sample.json
          if-no-files-found: warn
          retention-days: 30
