name: SI-4 LAMP 2024 Archive Pilot

on:
  push:
    branches:
      - si4-lamp-assim-review
    paths:
      - '.github/workflows/si4-lamp-archive-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: si4-lamp-archive-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Assert isolated 2024-only research lane
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "si4-lamp-assim-review"
          grep -q 'issuance_time_lamp_assim_v1' research/SI4_LAMP_ASSIM_REVIEW.md
          grep -q '2024-only' research/SI4_LAMP_ASSIM_REVIEW.md
          grep -q 'If any 2024 gate fails' research/SI4_LAMP_ASSIM_REVIEW.md
          grep -q 'NO PROMOTION' research/SI4_LAMP_ASSIM_REVIEW.md

      - name: Build sparse remote TAR index and verify predeclared 2024 members
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lamp-pilot
          python - <<'PY'
          import gzip, hashlib, http.client, json, pathlib, re, time

          HOST = 'lamp.mdl.nws.noaa.gov'
          PATH = '/lamp/Data/archives/lmp_lavtxt.2024.tar'
          URL = 'https://' + HOST + PATH
          TARGETS = [
              'lmp_lavtxt.202401.0030z.gz',
              'lmp_lavtxt.202404.0030z.gz',
              'lmp_lavtxt.202407.0030z.gz',
              'lmp_lavtxt.202409.0030z.gz',
              'lmp_lavtxt.202410.0030z.gz',
              'lmp_lavtxt.202412.0030z.gz',
          ]
          root = pathlib.Path('lamp-pilot')
          conn = None

          def reconnect():
              global conn
              try:
                  if conn:
                      conn.close()
              except Exception:
                  pass
              conn = http.client.HTTPSConnection(HOST, timeout=30)

          reconnect()
          conn.request('HEAD', PATH)
          resp = conn.getresponse()
          resp.read()
          if resp.status != 200:
              raise SystemExit(f'HEAD failed: {resp.status}')
          archive_meta = {k.lower(): v for k, v in resp.getheaders()}
          length = int(archive_meta['content-length'])
          if archive_meta.get('accept-ranges', '').lower() != 'bytes':
              raise SystemExit('NOAA annual archive does not advertise byte ranges')

          request_count = 0
          bytes_transferred = 0
          def get_range(start, end):
              global request_count, bytes_transferred
              expected = end - start + 1
              last = None
              for attempt in range(3):
                  try:
                      conn.request('GET', PATH, headers={'Range': f'bytes={start}-{end}'})
                      r = conn.getresponse()
                      body = r.read()
                      request_count += 1
                      bytes_transferred += len(body)
                      if r.status == 206 and len(body) == expected:
                          return body
                      last = RuntimeError(f'status={r.status} len={len(body)} expected={expected}')
                  except Exception as exc:
                      last = exc
                  reconnect()
                  time.sleep(0.5 * (attempt + 1))
              raise RuntimeError(f'range {start}-{end} failed after retries: {last}')

          members = []
          by_name = {}
          pos = 0
          while pos + 512 <= length:
              hdr = get_range(pos, pos + 511)
              if hdr == b'\0' * 512:
                  break
              name = hdr[:100].split(b'\0', 1)[0].decode('utf-8', 'strict')
              raw_size = hdr[124:136].split(b'\0', 1)[0].strip() or b'0'
              size = int(raw_size, 8)
              rec = {
                  'name': name,
                  'size_bytes': size,
                  'tar_header_offset': pos,
                  'payload_start': pos + 512,
                  'payload_end': pos + 511 + size,
              }
              members.append(rec)
              by_name[name] = rec
              pos = ((pos + 512 + size + 511) // 512) * 512
              if len(members) > 2000:
                  raise SystemExit('Unexpected TAR member count >2000')

          missing = [name for name in TARGETS if name not in by_name]
          if missing:
              raise SystemExit(f'Predeclared standard LAMP members missing: {missing}')

          def slots(line):
              # LAMP alphanumeric guidance uses a 5-character row label/prefix
              # followed by fixed 3-character forecast slots. Preserve NG and 99
              # as values rather than treating them as absent data here.
              if not line:
                  return []
              body = line[5:]
              return [body[i:i+3].strip() for i in range(0, len(body), 3) if body[i:i+3].strip()]

          selected = []
          station_header = re.compile(r'^\s*K[A-Z0-9]{3}\s{2,}')
          for name in TARGETS:
              rec = dict(by_name[name])
              payload = get_range(rec['payload_start'], rec['payload_end'])
              rec['sha256'] = hashlib.sha256(payload).hexdigest()
              text = gzip.decompress(payload).decode('utf-8', 'replace')
              rec['decompressed_bytes'] = len(text.encode())
              lines = text.splitlines()
              ksba_idx = [i for i, line in enumerate(lines) if re.match(r'^\s*KSBA\s{2,}', line)]
              blocks = []
              for i in ksba_idx:
                  end = len(lines)
                  for j in range(i + 1, len(lines)):
                      if station_header.match(lines[j]):
                          end = j
                          break
                  block = lines[i:end]
                  utc = next((x for x in block if re.match(r'^\s*UTC\s', x)), '')
                  wdr = next((x for x in block if re.match(r'^\s*WDR\s', x)), '')
                  wsp = next((x for x in block if re.match(r'^\s*WSP\s', x)), '')
                  wgs = next((x for x in block if re.match(r'^\s*WGS\s', x)), '')
                  utc_slots, wdr_slots, wsp_slots, wgs_slots = map(slots, (utc, wdr, wsp, wgs))
                  # NOAA LAMP v2.5 states WDR/WSP/WGS extend through 38 h, while
                  # standard hourly bulletins cover 1-25 h. Some archived 2024
                  # monthly text omits an HR row but carries exactly 25 standard
                  # hourly slots. Position 24 (index 23) is therefore the exact
                  # fixed-24h guidance slot; we require it to physically exist in
                  # all wind rows instead of inferring from a future observation.
                  standard = min(len(utc_slots), len(wdr_slots), len(wsp_slots), len(wgs_slots)) >= 25
                  blocks.append({
                      'utc_slots': len(utc_slots),
                      'wdr_slots': len(wdr_slots),
                      'wsp_slots': len(wsp_slots),
                      'wgs_slots': len(wgs_slots),
                      'has_f24_slots': standard,
                      'f24_utc': utc_slots[23] if len(utc_slots) >= 24 else None,
                      'f24_wdr': wdr_slots[23] if len(wdr_slots) >= 24 else None,
                      'f24_wsp': wsp_slots[23] if len(wsp_slots) >= 24 else None,
                      'f24_wgs': wgs_slots[23] if len(wgs_slots) >= 24 else None,
                      'header': lines[i][:160],
                  })
              rec['ksba_block_count'] = len(blocks)
              rec['ksba_standard_25slot_blocks'] = sum(b['has_f24_slots'] for b in blocks)
              rec['ksba_nonstandard_or_partial_blocks'] = len(blocks) - rec['ksba_standard_25slot_blocks']
              rec['block_diagnostics_sample'] = blocks[:5]
              if not blocks:
                  raise SystemExit(f'{name}: KSBA absent')
              if rec['ksba_standard_25slot_blocks'] < 1:
                  raise SystemExit(f'{name}: no KSBA standard block with 25 UTC/WDR/WSP/WGS slots')
              selected.append(rec)

          report = {
              'candidate': 'issuance_time_lamp_assim_v1',
              'science_scoring_performed': False,
              'verifying_observations_read': False,
              'year': 2024,
              'f24_definition': '24th standard hourly guidance slot (index 23); NOAA LAMP v2.5 standard guidance covers 1-25 h and WDR/WSP/WGS extend to 38 h',
              'archive_url': URL,
              'archive_content_length': length,
              'archive_etag': archive_meta.get('etag'),
              'archive_last_modified': archive_meta.get('last-modified'),
              'tar_member_count': len(members),
              'sparse_index_requests': request_count,
              'bytes_transferred_total': bytes_transferred,
              'transfer_fraction': bytes_transferred / length,
              'predeclared_members': TARGETS,
              'selected': selected,
          }
          (root / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          (root / 'tar-index.json').write_text(json.dumps(members, indent=2) + '\n')
          print(json.dumps({k:v for k,v in report.items() if k != 'selected'}, indent=2))
          for rec in selected:
              print(rec['name'], rec['sha256'], 'KSBA=', rec['ksba_block_count'], 'standard25=', rec['ksba_standard_25slot_blocks'], 'partial=', rec['ksba_nonstandard_or_partial_blocks'])
              print(' sample=', json.dumps(rec['block_diagnostics_sample'][:2]))
          PY

      - name: Upload auditable archive-pilot report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-lamp-2024-archive-pilot
          path: |
            lamp-pilot/report.json
            lamp-pilot/tar-index.json
          if-no-files-found: warn
          retention-days: 30
