name: SI-4 NDFD 2024 Pipeline Pilot

on:
  push:
    branches: ["si4-ndfd-benchmark"]
    paths:
      - 'tools/run-ndfd-pilot.py'
      - '.github/workflows/si4-ndfd-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: si4-ndfd-2024-pilot
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GRIB2 decoder
        run: |
          python -m pip install --quiet 'eccodes==2.44.0'
          python -m eccodes selfcheck
      - name: Run predeclared 2024 NDFD/HADS pipeline pilot
        run: python tools/run-ndfd-pilot.py
      - name: Validate no-hindsight pilot integrity
        run: |
          python - <<'PY'
          import json
          x=json.load(open('research/ndfd-pilot-2024.json'))
          assert x['status']=='RESEARCH_ONLY_PIPELINE_PILOT_NOT_SKILL_EVIDENCE'
          r=x['rules']
          assert r['2024_only'] is True
          assert r['2025_holdout_untouched'] is True
          assert r['future_observation_leakage'] is False
          assert r['latest_revision_after_cutoff_forbidden'] is True
          assert r['exact_valid_time_required'] is True
          d=x['pilot_diagnostics']
          assert d['rows_total']==10, d
          assert d['rows_with_hads']>=6, d
          assert d['max_grid_distance_km'] < 20, d
          assert d['minimum_effective_lead_hours'] >= 24, d
          for c in x['cases']:
              assert c['effective_lead_hours']>=24, c
              assert set(c['sources'])=={'wdir','wspd','wgust'}
              assert all(len(v['sha256'])==64 for v in c['sources'].values())
          print('2024 NDFD/HADS pipeline pilot passed integrity checks; diagnostic errors are not skill evidence')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-ndfd-2024-pilot
          path: research/ndfd-pilot-2024.json
          if-no-files-found: warn
          retention-days: 30
