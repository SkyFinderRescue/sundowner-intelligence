# Research plumbing only: expose latest frozen upstream-thermal archive run state without changing science.
name: SI-4 Upstream Thermal Archive Run Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/si4-upstream-thermal-run-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve latest upstream archive push run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --repo SkyFinderRescue/sundowner-intelligence \
            --workflow si4-upstream-thermal-2024-archive.yml \
            --branch si4-research \
            --event push \
            --limit 5 \
            --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url \
            > /tmp/upstream-runs.json
          cat /tmp/upstream-runs.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/upstream-runs.json'))
          assert x, 'no upstream archive runs found'
          r=x[0]
          print({'latest_run_id':r['databaseId'],'status':r['status'],'conclusion':r['conclusion'],'headSha':r['headSha']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: si4-upstream-thermal-run-probe
          path: /tmp/upstream-runs.json
          if-no-files-found: error
          retention-days: 7
