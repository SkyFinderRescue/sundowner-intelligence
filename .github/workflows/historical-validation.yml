name: Sundowner Historical Validation

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Validation start date (YYYY-MM-DD)
        required: true
        default: '2025-03-01'
      end_date:
        description: Validation end date (YYYY-MM-DD)
        required: true
        default: '2025-05-31'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check tools/validate-fixed-lead.js
      - name: Independent 24h/48h RAWS validation
        env:
          VALIDATION_START: ${{ inputs.start_date }}
          VALIDATION_END: ${{ inputs.end_date }}
          VALIDATION_LEADS: '1,2'
        run: node tools/validate-fixed-lead.js
