name: Sundowner Historical Validation

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Validation start date (YYYY-MM-DD)
        required: true
        default: '2025-03-01'
      end_date:
        description: Validation end date (YYYY-MM-DD)
        required: true
        default: '2025-05-31'
  push:
    branches: ["main"]
    paths:
      - "tools/validate-fixed-lead.js"
      - ".github/workflows/historical-validation.yml"

permissions:
  contents: write

concurrency:
  group: sundowner-historical-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check tools/validate-fixed-lead.js
      - name: Independent 24h/48h RAWS validation
        id: run
        continue-on-error: true
        env:
          VALIDATION_START: ${{ inputs.start_date || '2025-03-01' }}
          VALIDATION_END: ${{ inputs.end_date || '2025-05-31' }}
          VALIDATION_LEADS: '1,2'
        run: node tools/validate-fixed-lead.js
      - name: Preserve outputs before syncing current main
        if: always()
        env:
          OUTCOME: ${{ steps.run.outcome }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p /tmp/si-validation
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('/tmp/si-validation/status.json',JSON.stringify({checked_at:new Date().toISOString(),source_commit:process.env.SHA,outcome:process.env.OUTCOME,period:['2025-03-01','2025-05-31'],leads_hours:[24,48]},null,2)+'\n');
          NODE
          if [ "$OUTCOME" = "success" ]; then cp validation/fixed-lead-latest.json /tmp/si-validation/result.json; fi
      - name: Publish validation result and status on current main
        if: always()
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p validation
          cp /tmp/si-validation/status.json validation/fixed-lead-status.json
          if [ "$OUTCOME" = "success" ]; then cp /tmp/si-validation/result.json validation/fixed-lead-latest.json; fi
          git add validation/fixed-lead-status.json
          if [ "$OUTCOME" = "success" ]; then git add validation/fixed-lead-latest.json; fi
          git commit -m "Record enhanced fixed-lead validation [skip ci]" || exit 0
          git push origin HEAD:main
      - name: Fail if validation failed
        if: steps.run.outcome != 'success'
        run: exit 1
