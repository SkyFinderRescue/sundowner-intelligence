name: SI-4 HREF 2024 Full Ensemble Archive

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/extract-si4-href-ensemble-2024.js'
      - '.github/workflows/si4-href-2024-full-archive.yml'
      - 'research/SI4_INITIAL_CONDITION_ENSEMBLE_DOWNSLOPE_2024_PREDECLARED.md'
      - 'research/SI4_INITIAL_CONDITION_ENSEMBLE_DOWNSLOPE_PHASE0_DECISION.md'
      - 'research/SI4_HREF_2024_ARCHIVE_AVAILABILITY_NOTE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: si4-href-2024-full-archive
  cancel-in-progress: true

jobs:
  archive-month:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {month: '01', start: '2024-01-01', end: '2024-01-31'}
          - {month: '02', start: '2024-02-01', end: '2024-02-29'}
          - {month: '03', start: '2024-03-01', end: '2024-03-31'}
          - {month: '04', start: '2024-04-01', end: '2024-04-30'}
          - {month: '05', start: '2024-05-01', end: '2024-05-31'}
          - {month: '06', start: '2024-06-01', end: '2024-06-30'}
          - {month: '07', start: '2024-07-01', end: '2024-07-31'}
          - {month: '08', start: '2024-08-01', end: '2024-08-31'}
          - {month: '09', start: '2024-09-01', end: '2024-09-30'}
          - {month: '10', start: '2024-10-01', end: '2024-10-31'}
          - {month: '11', start: '2024-11-01', end: '2024-11-30'}
          - {month: '12', start: '2024-12-01', end: '2024-12-30'}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify frozen 2024-only extractor
        run: |
          set -euo pipefail
          node --check tools/extract-si4-href-ensemble-2024.js
          grep -q "initial_condition_ensemble_downslope_v1" tools/extract-si4-href-ensemble-2024.js
          grep -q "ISSUANCE_HOURS=\[0,12\]" tools/extract-si4-href-ensemble-2024.js
          for t in \
            '2024-11-27T00:00:00.000Z' '2024-11-27T12:00:00.000Z' \
            '2024-11-28T00:00:00.000Z' '2024-11-28T12:00:00.000Z' \
            '2024-11-29T00:00:00.000Z' '2024-11-29T12:00:00.000Z' \
            '2024-11-30T00:00:00.000Z' \
            '2024-12-01T00:00:00.000Z' '2024-12-01T12:00:00.000Z' \
            '2024-12-02T00:00:00.000Z' '2024-12-08T12:00:00.000Z' \
            '2024-12-09T00:00:00.000Z'; do
            grep -q "$t" tools/extract-si4-href-ensemble-2024.js
          done
      - name: Extract frozen HREF month with bounded infrastructure retry
        shell: bash
        run: |
          set -euo pipefail
          out="research/si4-href-ensemble-2024-${{ matrix.month }}.json"
          ok=0
          for attempt in 1 2 3; do
            if node tools/extract-si4-href-ensemble-2024.js --start '${{ matrix.start }}' --end '${{ matrix.end }}' --out "$out"; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt*30)); fi
          done
          test "$ok" -eq 1
      - name: Verify fail-closed monthly contract
        env:
          MONTH: ${{ matrix.month }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const month=process.env.MONTH,start=process.env.START,end=process.env.END;
          const x=JSON.parse(fs.readFileSync(`research/si4-href-ensemble-2024-${month}.json`,'utf8'));
          if(x.status!=='RESEARCH_ONLY_2024_DEVELOPMENT'||x.candidate_family!=='initial_condition_ensemble_downslope_v1') throw Error('archive contract mismatch');
          if(x.science_scoring_performed!==false||x.observations_or_outcomes_used!==false||x.future_observations_used!==false||x.fire_association_used!==false) throw Error('outcome/leakage contract failed');
          if(x.holdout_2025_loaded!==false||x.production_change_authorized!==false) throw Error('2025/production firewall failed');
          if(x.start!==start||x.end!==end||x.forecast_lead_hours!==24) throw Error('date/lead mismatch');
          if(JSON.stringify(x.issuance_hours_utc)!==JSON.stringify([0,12])||x.member_count!==10||x.point_count!==5) throw Error('frozen member/time/point mismatch');
          const days=Math.round((Date.parse(end+'T00:00:00Z')-Date.parse(start+'T00:00:00Z'))/86400000)+1;
          const frozenExcluded=['2024-11-27T00:00:00.000Z','2024-11-27T12:00:00.000Z','2024-11-28T00:00:00.000Z','2024-11-28T12:00:00.000Z','2024-11-29T00:00:00.000Z','2024-11-29T12:00:00.000Z','2024-11-30T00:00:00.000Z','2024-12-01T00:00:00.000Z','2024-12-01T12:00:00.000Z','2024-12-02T00:00:00.000Z','2024-12-08T12:00:00.000Z','2024-12-09T00:00:00.000Z'];
          const expectedExcluded=frozenExcluded.filter(t=>t.slice(0,10)>=start&&t.slice(0,10)<=end);
          const expected=days*2*10*5-expectedExcluded.length*50;
          if(x.failure_count!==0||x.row_count!==expected||x.rows.length!==expected) throw Error(`month incomplete ${x.row_count}/${expected}`);
          if(JSON.stringify(x.excluded_issuances)!==JSON.stringify(expectedExcluded)) throw Error('availability exclusion mismatch');
          const seen=new Set();
          for(const r of x.rows){
            if(!String(r.issuance_time).startsWith('2024-')||!String(r.valid_time).startsWith('2024-')||r.issuance_to_valid_lead_h!==24) throw Error('non-2024/lead row');
            if(![0,12].includes(new Date(r.issuance_time).getUTCHours())) throw Error('unexpected issuance hour');
            if(frozenExcluded.includes(r.issuance_time)) throw Error('excluded issuance leaked into archive');
            const k=[r.issuance_time,r.member_id,r.point].join('|'); if(seen.has(k)) throw Error('duplicate '+k); seen.add(k);
            for(const f of ['u10_mps','v10_mps','wind_speed_10m_mps','wind_direction_10m_deg','gust_surface_mps','pressure_surface_pa']) if(!Number.isFinite(Number(r[f]))) throw Error(`nonfinite ${f} ${k}`);
          }
          console.log({month,rows:x.row_count,excluded:x.excluded_issuances,status:'PASS'});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-href-ensemble-2024-${{ matrix.month }}
          path: research/si4-href-ensemble-2024-${{ matrix.month }}.json
          if-no-files-found: error
          retention-days: 30

  combine-archive:
    needs: archive-month
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: si4-href-ensemble-2024-??
          path: monthly
          merge-multiple: true
      - name: Combine immutable 2024 HREF archive and provenance
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const rows=[],seen=new Set(),monthly=[];
          const frozenExcluded=['2024-11-27T00:00:00.000Z','2024-11-27T12:00:00.000Z','2024-11-28T00:00:00.000Z','2024-11-28T12:00:00.000Z','2024-11-29T00:00:00.000Z','2024-11-29T12:00:00.000Z','2024-11-30T00:00:00.000Z','2024-12-01T00:00:00.000Z','2024-12-01T12:00:00.000Z','2024-12-02T00:00:00.000Z','2024-12-08T12:00:00.000Z','2024-12-09T00:00:00.000Z'];
          for(let m=1;m<=12;m++){
            const mm=String(m).padStart(2,'0'),p=path.join('monthly',`si4-href-ensemble-2024-${mm}.json`);
            if(!fs.existsSync(p)) throw Error('missing '+p);
            const raw=fs.readFileSync(p),x=JSON.parse(raw);
            if(x.status!=='RESEARCH_ONLY_2024_DEVELOPMENT'||x.candidate_family!=='initial_condition_ensemble_downslope_v1'||x.failure_count!==0) throw Error('invalid month '+mm);
            monthly.push({month:mm,file:path.basename(p),sha256:crypto.createHash('sha256').update(raw).digest('hex'),rows:x.row_count,start:x.start,end:x.end,excluded_issuances:x.excluded_issuances||[]});
            for(const r of x.rows){const k=[r.issuance_time,r.member_id,r.point].join('|');if(seen.has(k))throw Error('duplicate '+k);seen.add(k);rows.push(r);}
          }
          const expected=365*2*10*5-frozenExcluded.length*50;
          if(rows.length!==expected) throw Error(`unexpected full-year rows ${rows.length}/${expected}`);
          if(rows.some(r=>frozenExcluded.includes(r.issuance_time))) throw Error('frozen excluded issuance present');
          rows.sort((a,b)=>a.issuance_time.localeCompare(b.issuance_time)||a.member_id.localeCompare(b.member_id)||a.point.localeCompare(b.point));
          const out={status:'RESEARCH_ONLY_2024_DEVELOPMENT',candidate_family:'initial_condition_ensemble_downslope_v1',phase:'full_2024_href_member_archive',science_scoring_performed:false,observations_or_outcomes_used:false,future_observations_used:false,fire_association_used:false,holdout_2025_loaded:false,production_change_authorized:false,forecast_lead_hours:24,issuance_hours_utc:[0,12],initialization_start:'2024-01-01',initialization_end:'2024-12-30',valid_time_start:'2024-01-02',valid_time_end:'2024-12-31',member_count:10,point_count:5,row_count:rows.length,failure_count:0,excluded_issuances:frozenExcluded,availability_rule:'exclude an entire issuance only when a required frozen member/point is persistently unavailable after bounded retries, determined without observations/outcomes',provenance:{github_run_id:process.env.RUN_ID,head_sha:process.env.HEAD_SHA,monthly_artifacts:monthly},rows};
          fs.writeFileSync('si4-href-ensemble-2024-full.json',JSON.stringify(out));
          fs.writeFileSync('si4-href-ensemble-2024-manifest.json',JSON.stringify(out.provenance,null,2));
          console.log({status:'PASS',rows:rows.length,months:monthly.length,excluded:frozenExcluded,head:process.env.HEAD_SHA,run_id:process.env.RUN_ID});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: si4-href-ensemble-2024-full
          path: |
            si4-href-ensemble-2024-full.json
            si4-href-ensemble-2024-manifest.json
          if-no-files-found: error
          retention-days: 30
