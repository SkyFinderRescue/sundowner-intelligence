name: SI-4 Upstream ABL Reservoir 2024 Chronological CV

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/evaluate-si4-upstream-abl-2024-cv.js'
      - 'research/SI4_UPSTREAM_ABL_RESERVOIR_2024_PREDECLARED.md'
      - '.github/workflows/si4-upstream-abl-2024-cv.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upstream-abl-2024-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and leakage guards
        run: |
          set -euo pipefail
          node --check tools/evaluate-si4-upstream-abl-2024-cv.js
          grep -q 'const START="2024-01-01", END="2024-12-31"' tools/evaluate-si4-upstream-abl-2024-cv.js
          grep -q 'holdout_2025_loaded:false' tools/evaluate-si4-upstream-abl-2024-cv.js
          ! grep -q '2025-' tools/evaluate-si4-upstream-abl-2024-cv.js
      - name: Download authoritative frozen baseline upper-air artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/si4-frozen
          gh run download 31925677059 --repo SkyFinderRescue/sundowner-intelligence --name si4-all-season-frozen-holdout --dir /tmp/si4-frozen
          test -s /tmp/si4-frozen/hrrr-upper-fixed-lead-all-season.json
      - name: Download immutable 2024 upstream ABL archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/si4-abl
          gh run download 32585722096 --repo SkyFinderRescue/sundowner-intelligence --name si4-upstream-abl-2024-full --dir /tmp/si4-abl
          test -s /tmp/si4-abl/si4-upstream-abl-2024-full.json
          node - <<'NODE'
          const x=require('/tmp/si4-abl/si4-upstream-abl-2024-full.json');
          if(x.row_count!==4380||x.failure_count!==0||String(x.provenance.github_run_id)!=='32585722096'||x.provenance.head_sha!=='92bc3fcc22f87a8b068503f08145e8b0fefbf584') process.exit(2);
          if(x.candidate_family!=='upstream_abl_reservoir_v1'||x.forecast_lead_hours!==24) process.exit(3);
          if(x.rules.holdout_2025_loaded!==false||x.rules.production_change_authorized!==false||x.rules.future_observations_label_only!==true||x.rules.fire_association_outcome_only!==true) process.exit(4);
          console.log({rows:x.row_count,run:x.provenance.github_run_id,head:x.provenance.head_sha,pblh:x.field_availability});
          NODE
      - name: Run frozen 2024 chronological CV
        env:
          UPPER_CACHE: /tmp/si4-frozen/hrrr-upper-fixed-lead-all-season.json
          ABL_CACHE: /tmp/si4-abl/si4-upstream-abl-2024-full.json
          OUT: research/si4-upstream-abl-2024-cv.json
        run: node tools/evaluate-si4-upstream-abl-2024-cv.js
      - name: Verify fail-closed scientific decision
        run: |
          node - <<'NODE'
          const x=require('./research/si4-upstream-abl-2024-cv.json');
          if(x.status!=='RESEARCH_ONLY_2024_DEVELOPMENT'||x.rules.holdout_2025_loaded!==false||x.rules.production_change_authorized!==false) process.exit(2);
          if(x.candidate_family!=='upstream_abl_reservoir_v1'||x.rules.exact_f24!==true) process.exit(3);
          if(typeof x.passes_all!=='boolean'||!x.gates) process.exit(4);
          console.log({rows:x.counts.rows,events:x.counts.events,passes_all:x.passes_all,eligible:x.winner_eligible_for_single_frozen_2025_score});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si4-upstream-abl-2024-cv
          path: research/si4-upstream-abl-2024-cv.json
          if-no-files-found: warn
          retention-days: 30
